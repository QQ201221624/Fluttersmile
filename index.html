<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>智能排障助手</title>
    <!-- Font Awesome 6 (轻量图标) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1c1e24;
            line-height: 1.4;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 720px;
            margin: 0 auto;
            background-color: #f5f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 简洁头部 */
        .nav-header {
            padding: 16px 20px 12px 20px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 0.5px solid rgba(0,0,0,0.05);
            background-color: #f5f7fb;
        }
        .logo-area h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #1E3C72, #2A5298);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .header-actions i {
            font-size: 22px;
            color: #2c3e66;
            background-color: rgba(44,62,102,0.08);
            padding: 8px;
            border-radius: 30px;
        }

        /* 卡片设计 */
        .card {
            background-color: #ffffff;
            border-radius: 28px;
            padding: 20px;
            margin: 16px 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.02);
            border: 0.5px solid rgba(0,0,0,0.03);
        }

        .diagnostic-card {
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: 630;
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e2a3e;
        }

        .input-group {
            background-color: #f8f9fe;
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 18px;
            border: 0.5px solid #eef2f8;
        }

        textarea {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 15px;
            font-family: ui-monospace, 'Menlo', monospace;
            resize: vertical;
            outline: none;
            padding: 12px 8px;
            color: #1e293b;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #9aa1b2;
            font-family: system-ui;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            justify-content: flex-end;
            align-items: center;
        }

        .btn-primary {
            background-color: #1c3f6e;
            border: none;
            padding: 12px 20px;
            border-radius: 44px;
            font-weight: 590;
            font-size: 15px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-primary:active {
            transform: scale(0.97);
            background-color: #0f2d4e;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #cdd9f0;
            padding: 10px 16px;
            border-radius: 44px;
            font-size: 14px;
            font-weight: 500;
            color: #2c5282;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* 诊断结果区域 */
        .result-section {
            margin-top: 12px;
            background: #fefefe;
            border-radius: 24px;
            transition: all 0.2s;
        }

        .diag-item {
            background: #f9fafc;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            border: 0.5px solid #edf2f7;
        }

        .diag-title {
            font-weight: 650;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e2a3e;
        }

        .diag-desc {
            font-size: 14px;
            color: #2d3a4b;
            line-height: 1.45;
            white-space: pre-line;
        }

        .empty-hint {
            text-align: center;
            padding: 28px 16px;
            color: #8e9aaf;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 780px;
                margin: 0 auto;
                box-shadow: none;
            }
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        i, .btn-primary, .btn-outline {
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 简洁头部 -->
    <div class="nav-header">
        <div class="logo-area">
            <h1>智能排障助手</h1>
        </div>
        <div class="header-actions">
            <i class="fas fa-robot"></i>
        </div>
    </div>

    <!-- 核心功能区：智能分析卡片 -->
    <div class="card diagnostic-card">
        <div class="section-title">
            <i class="fas fa-stethoscope" style="color: #2a5c9e;"></i> 智能助手
            <span style="font-size: 13px; font-weight: normal; background: #eef2ff; padding: 4px 10px; border-radius: 30px; margin-left: auto;">AI 推理引擎</span>
        </div>

        <!-- 日志输入区 -->
        <div class="input-group">
            <textarea id="logInput" rows="4" placeholder="📄 粘贴或输入错误日志...&#10;例如：kernel abnormal reboot 或 MySQL ERROR 2003..."></textarea>
            <div class="button-row">
                <label for="fileUpload" class="btn-outline" style="margin:0;"><i class="fas fa-upload"></i> 上传日志</label>
                <input type="file" id="fileUpload" accept=".log,.txt" style="display: none;">
                <button class="btn-primary" id="analyzeBtn"><i class="fas fa-microchip"></i> 智能分析</button>
            </div>
        </div>

        <!-- 诊断结果显示区 -->
        <div id="resultContainer" class="result-section">
            <!-- 初始加载会通过js填充手机重启案例结果 -->
        </div>
    </div>
</div>

<script>
    // ----------------------------------------------
    // 智能诊断核心逻辑 (模拟 + 语义匹配)
    // ----------------------------------------------
    function smartDiagnose(logText) {
        if (!logText || logText.trim() === "") {
            return {
                summary: "未检测到有效日志",
                reason: "请粘贴错误日志或上传包含日志的文件。",
                solution: "粘贴日志内容后点击「智能分析」即可获得诊断结果。"
            };
        }
        const lowerLog = logText.toLowerCase();
        
        // 1. 内核看门狗 / 手机自动重启 (kernel + AP_WDT / Power_key / abnormal reboot)
        if (lowerLog.includes("kernel") && (lowerLog.includes("abnormal") || lowerLog.includes("reboot") || lowerLog.includes("ap_wdt") || lowerLog.includes("power_key") || lowerLog.includes("watchdog"))) {
            return {
                summary: "内核因应用看门狗（AP_WDT）超时而主动关机并重启",
                reason: "系统关键进程（如系统服务）未及时喂狗，触发硬件超时复位（常见于系统高负载、死锁）。",
                solution: "1. 重启后抓取相关日志，定位超时前的最后进程调用栈\n2. 检查最近安装的应用或系统更新，尝试卸载可疑应用或回滚更新\n3. 若频繁发生，备份数据后恢复出厂设置，排除软件冲突；仍无效则可能为主板硬件故障，需要维修"
            };
        }
        
        // 2. MySQL / 数据库连接错误  (2003, connection refused, 10061)
        if (lowerLog.includes("mysql") && (lowerLog.includes("error 2003") || lowerLog.includes("can't connect") || lowerLog.includes("10061") || lowerLog.includes("connection refused"))) {
            return {
                summary: "应用程序连接本地MySQL数据库被拒绝，网络层连接失败",
                reason: "MySQL服务未启动，或3306端口被系统防火墙拦截（依据日志关键词“Connection refused”）。",
                solution: "Linux/macOS:\n  sudo systemctl status mysql\n  sudo systemctl start mysql\n  sudo ufw allow 3306\n\nWindows:\n  检查服务管理器启动MySQL服务，防火墙入站规则新建端口3306。"
            };
        }
        
        // 3. 通用的 Connection refused / 超时类问题
        if (lowerLog.includes("connection refused") || lowerLog.includes("timeout") || lowerLog.includes("connect failed")) {
            return {
                summary: "服务连接被拒绝或请求超时，网络通信异常",
                reason: "目标服务未运行、端口错误、防火墙拦截或网络不可达。",
                solution: "1. 确认目标服务状态: `systemctl status <service>`\n2. 检查端口监听: `netstat -tunlp | grep <port>`\n3. 测试连通性: `telnet <ip> <port>` 或 `nc -vz <ip> <port>`"
            };
        }
        
        // 4. 覆盖其他常见错误 (比如权限、文件找不到等)
        if (lowerLog.includes("permission denied")) {
            return {
                summary: "权限不足导致操作失败",
                reason: "当前用户缺少对文件或命令的执行权限。",
                solution: "使用 `sudo` 提升权限，或检查文件所有权: `chmod +x` / `chown` 调整。"
            };
        }
        
        if (lowerLog.includes("not found") || lowerLog.includes("no such file")) {
            return {
                summary: "文件或命令未找到",
                reason: "路径错误、依赖缺失或环境变量未配置。",
                solution: "确认文件路径是否正确，使用 `which` 命令检查命令位置，或安装缺失的软件包。"
            };
        }
        
        // 默认智能分析
        return {
            summary: "已检测到异常日志，系统将给出通用排查方向",
            reason: "根据日志特征，可能涉及配置、资源或依赖问题，需要进一步结合上下文分析。",
            solution: "建议步骤：\n1. 查看错误附近的时间戳，分析同期系统事件\n2. 检查相关服务状态与配置文件\n3. 尝试重启服务或应用，并观察是否复现\n💡 使用智能排障助手持续积累故障库可获取更精准方案。"
        };
    }

    // 渲染诊断结果
    function renderDiagnosis(logText) {
        const diag = smartDiagnose(logText);
        const container = document.getElementById("resultContainer");
        container.innerHTML = `
            <div class="fade-in">
                <div class="diag-item">
                    <div class="diag-title"><i class="fas fa-clipboard-list"></i> 问题摘要</div>
                    <div class="diag-desc">${escapeHtml(diag.summary)}</div>
                </div>
                <div class="diag-item">
                    <div class="diag-title"><i class="fas fa-bullseye"></i> 原因定位</div>
                    <div class="diag-desc">${escapeHtml(diag.reason)}</div>
                </div>
                <div class="diag-item">
                    <div class="diag-title"><i class="fas fa-tools"></i> 解决方案</div>
                    <div class="diag-desc">${escapeHtml(diag.solution)}</div>
                </div>
                <div style="margin-top: 12px; font-size: 12px; text-align: right; color:#8aa0bc;"><i class="fas fa-robot"></i> 基于故障库 + 大模型推理</div>
            </div>
        `;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 手机重启的示例日志 (内核看门狗)
    const exampleKernelLog = `------ kernel abnormal reboot records ------
kernel poweroff   : Power_keys_long_press
record time_stamp : 2026-04-30 14:13:17
kernel reboot     : reboot_longkey
record time_stamp : 2026-04-30 14:13:17
------------------------------------
kernel poweroff   : AP_WDT
record time_stamp : 2026-04-30 16:24:25
kernel reboot     : reboot
record time_stamp : 2026-04-30 16:24:23`;

    // 绑定分析按钮
    document.getElementById("analyzeBtn").addEventListener("click", function() {
        const logContent = document.getElementById("logInput").value;
        if (!logContent.trim()) {
            document.getElementById("resultContainer").innerHTML = `<div class="empty-hint"><i class="fas fa-exclamation-triangle"></i> 请先输入日志内容或上传日志文件</div>`;
            return;
        }
        renderDiagnosis(logContent);
    });

    // 上传日志文件
    const fileInput = document.getElementById("fileUpload");
    fileInput.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const content = evt.target.result;
            document.getElementById("logInput").value = content;
            renderDiagnosis(content);
            // 轻提示
            const toast = document.createElement("div");
            toast.innerText = "日志已载入，智能分析完成";
            toast.style.position = "fixed";
            toast.style.bottom = "24px";
            toast.style.left = "50%";
            toast.style.transform = "translateX(-50%)";
            toast.style.backgroundColor = "#1e293b";
            toast.style.color = "white";
            toast.style.padding = "8px 20px";
            toast.style.borderRadius = "40px";
            toast.style.fontSize = "13px";
            toast.style.zIndex = "999";
            toast.style.backdropFilter = "blur(8px)";
            toast.style.whiteSpace = "nowrap";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1800);
        };
        reader.readAsText(file, "UTF-8");
    });

    // 页面初始化：默认展示手机重启案例的日志及诊断结果
    window.addEventListener("load", function() {
        document.getElementById("logInput").value = exampleKernelLog;
        renderDiagnosis(exampleKernelLog);
    });
</script>
</body>
</html>
